# Sobe API e frontend com um único comando: docker compose up --build
# O banco de dados é o Supabase (PostgreSQL + PostGIS), configurado em backend/.env.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
